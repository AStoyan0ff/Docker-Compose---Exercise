services:
  mysql:
    image: mysql:8.0
    volumes:
      - reseller_mysql_data:/var/lib/mysql  

    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "resellerdb"

    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s  
      test:
        - CMD-SHELL
        - mysql -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" -e "SELECT 1"

  reseller:
    image: astoyan0ff/reseller:1.0
    ports:
      - "8000:8080"

    depends_on:
      mysql:
        condition: service_healthy  

    environment:
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "1234"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update 
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/resellerdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"

volumes:
  reseller_mysql_data:      
    
