services:
  db:
    image: postgres:latest
    volumes:
      - db_data:/var/lib/postgresql

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres

    networks:
      - backend   
  redis:
    image: redis:latest
    networks:
      - backend 

  vote:
    build: ./vote
    ports:
      - "5000:80"
    networks:
      - frontend
      - backend
    volumes:
      - ./vote:/app
    depends_on:
      - redis    

  result:
    build: ./result
    ports:
      - "5001:80"
    networks:
      - frontend
      - backend
    volumes:
      - ./result:/app
    depends_on:
      - db    

  worker:
    build: ./worker
    networks:
      - backend
    depends_on:
      - redis
      - db  

networks:
  frontend:
  backend:

volumes:
  db_data:  
   