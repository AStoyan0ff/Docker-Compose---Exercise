services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AStoyanoff123"

    volumes:
      - taskboard_sql_data:/var/opt/mssql

  taskboard:
    image: astoyan0ff/taskboard:1.1
    ports:
      - "8081:80"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  taskboard_sql_data: